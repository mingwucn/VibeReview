name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - run: python -m pip install -e '.[test]'

      - run: python -m pytest -m "not external_engine and not requires_bwrap"

  sandbox-conformance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          python -m pip install -e '.[test]'

      - name: Run sandbox conformance suite
        run: python -m pytest -m "requires_bwrap or sandbox_conformance"

