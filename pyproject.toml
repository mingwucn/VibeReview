[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vibereviewpaper"
version = "0.0.1"
description = "Evidence-constrained scientific review pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibereview = ["prompts/*.md"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src", "tests"]
testpaths = ["tests"]
markers = [
    "external_engine: requires a live external LLM-agent engine",
    "requires_bwrap: tests that require bubblewrap (bwrap) installed",
    "sandbox_conformance: OS sandbox backend qualification and conformance tests",
    "external_corpus: requires an explicitly opted-in operator corpus outside the repository",
]
